<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | KisanFlow</title><link rel="stylesheet" href="/static/style.css"></head><body><header><a class="logo" href="/">🌾 KisanFlow</a><span>Centre Administration</span></header><main class="page"><div class="title"><small>PROCUREMENT CENTRE</small><h1>Admin Login</h1><p>Sign in to create slots and manage the live farmer queue.</p></div><div class="card form"><label>Admin username<input id="identifier" value="admin@kisanflow.com" autocomplete="username"></label><label>Password<input id="password" type="password" value="Admin@123" autocomplete="current-password"></label><button class="btn wide" onclick="login()">Login to Admin</button><div id="result"></div><p class="privacy">Farmers should use <a href="/login">Farmer Login</a>.</p></div></main><script>async function login(){const result=document.getElementById('result');result.innerHTML='<div>Signing in...</div>';const r=await fetch('/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identifier:document.getElementById('identifier').value.trim(),password:document.getElementById('password').value})});const d=await r.json();if(r.ok){result.innerHTML='<div class="success">Login successful.</div>';location.href=d.redirect}else{result.innerHTML='<div class="error">'+(d.error||'Login failed.')+'</div>'}}document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()})</script></body></html>
